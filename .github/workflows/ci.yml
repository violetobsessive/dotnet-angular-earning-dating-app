name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: .NET 9 API ──────────────────────────────────────────────────
  api-build-test:
    name: API (dotnet build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
        # Will be a no-op until you add a test project — safe to leave in

      - name: Security audit (NuGet)
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
        continue-on-error: true

  # ── Frontend: Angular 20 ─────────────────────────────────────────────────
  client-build-test:
    name: Client (ng build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build (prod)
        run: npm run build -- --configuration production

      - name: Unit tests (headless)
        run: npm test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true  # Remove once you write tests

      - name: Security audit (npm)
        run: npm audit --audit-level=high
        continue-on-error: true
